<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" type="text/css">
    <title>Exemplo DIV</title>
</head>
<body>
        
        <div class="div-AlignCenter">
            Alinhado no Centro
        </div>

        <div class="div-Sticky">
            Posicionamento Sticky
        </div>

        <div class="div-Relative">
            Posicionamento Relativo
        </div>

        <div class="div-Fixed">
            Posicionamento Fixo
        </div>

        <div class="div-Static">
            Posicionamento Estatico
        </div>
    
        <div class="div-Absolute">
            Posicionamento Absoluto
        </div>

        <div class="div-AlignLeft">
        Alinhado a Esquerda
        </div>

        <div class="div-AlignRight">
            Alinhado a Direita
        </div>
        

       
</body>
</html>
